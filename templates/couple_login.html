<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Access</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            text-align: center;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(212,175,55,0.28);
            border-radius: 26px;
            padding: 42px 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .login-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 26px;
        }

        .login-logos img {
            max-height: 58px;
            object-fit: contain;
        }

        .login-divider {
            width: 1px;
            height: 46px;
            background: rgba(212,175,55,0.35);
        }

        .login-title {
            font-family: 'Cormorant Garamond', serif;
            color: #f2e4c7;
            font-size: 42px;
            line-height: 1;
            margin-bottom: 12px;
        }

        .login-subtitle {
            color: rgba(255,255,255,0.78);
            line-height: 1.7;
            margin-bottom: 26px;
        }

        .login-card input {
            margin-bottom: 16px;
            text-align: center;
        }

        .small-link {
            display: inline-block;
            margin-top: 20px;
            color: #f2d78c;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .login-card {
                padding: 32px 20px;
            }

            .login-title {
                font-size: 34px;
            }

            .login-divider {
                display: none;
            }

            .login-logos {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<main class="login-shell">

    <div class="login-card">

        <div class="login-logos">
            <img src="/static/norky-logo.png" alt="Norky Logo">
            <div class="login-divider"></div>
            <img src="/static/deannie-logo.png" alt="Deannie Landgoed Logo">
        </div>

        <div class="login-title">
            Couple Portal
        </div>

        <p class="login-subtitle">
            Private access for ceremony music, reception formalities,
            must-play songs and wedding music instructions.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mode-note">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Enter couple password"
                required
            >

            <button type="submit">
                Enter Couple Portal
            </button>

        </form>

        <a href="/" class="small-link">
            ← Back to guest page
        </a>

    </div>

</main>

</body>
</html>
