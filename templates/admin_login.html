<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norky Admin Login</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>

        .login-card {
            max-width: 420px;
            margin: 80px auto;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            margin-top: 20px;
        }

        .login-card button {
            width: 100%;
            margin-top: 20px;
        }

    </style>

</head>
<body>

<main class="page">

    <div class="container">

        <div class="login-card">

            <img
                src="/static/norky-logo.png"
                class="logo-norky"
                style="width:120px;"
            >

            <h1>Norky Admin</h1>

            <p class="subtitle">
                Secure Wedding Dashboard Access
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="mode-note">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST">

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Admin Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</main>

</body>
</html>
