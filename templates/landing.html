<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Norky Wedding Experience</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        .landing-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .landing-card {
            width: 100%;
            max-width: 760px;
            text-align: center;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(212,175,55,0.28);
            border-radius: 30px;
            padding: 46px 34px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .landing-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 30px;
        }

        .landing-logos img {
            max-height: 64px;
            object-fit: contain;
        }

        .landing-divider {
            width: 1px;
            height: 52px;
            background: rgba(212,175,55,0.35);
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #d4af37;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .landing-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 56px;
            line-height: 1;
            color: #f2e4c7;
            margin-bottom: 12px;
        }

        .landing-subtitle {
            color: rgba(255,255,255,0.82);
            line-height: 1.8;
            max-width: 560px;
            margin: 0 auto 34px;
        }

        .guest-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 30px;
        }

        .guest-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(212,175,55,0.20);
            border-radius: 22px;
            padding: 28px 22px;
            text-decoration: none;
            color: white;
            transition: 0.25s;
        }

        .guest-card:hover {
            transform: translateY(-5px);
            background: rgba(212,175,55,0.13);
        }

        .guest-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .guest-card h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .guest-card p {
            font-size: 14px;
            line-height: 1.7;
            opacity: 0.82;
        }

        .private-links {
            margin-top: 34px;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .private-links a {
            color: rgba(242,215,140,0.78);
            text-decoration: none;
        }

        .private-links a:hover {
            color: #f2d78c;
        }

        .footer-note {
            margin-top: 34px;
            opacity: 0.58;
            font-size: 12px;
            line-height: 1.7;
        }

        @media (max-width: 700px) {
            .landing-card {
                padding: 34px 20px;
                border-radius: 24px;
            }

            .landing-title {
                font-size: 40px;
            }

            .guest-actions {
                grid-template-columns: 1fr;
            }

            .landing-divider {
                display: none;
            }

            .landing-logos {
                flex-wrap: wrap;
            }

            .landing-logos img {
                max-height: 54px;
            }
        }
    </style>
</head>

<body>

<main class="landing-shell">

    <section class="landing-card">

        <div class="landing-logos">
            <img src="/static/norky-logo.png" alt="Norky Logo">
            <div class="landing-divider"></div>
            <img src="/static/deannie-logo.png" alt="Deannie Landgoed Logo">
        </div>

        <div class="eyebrow">
            Welcome to
        </div>

        <div class="landing-title">
            {{ settings["couple_names"] }}
        </div>

        <p class="landing-subtitle">
            {{ settings["welcome_message"] }}
        </p>

        <div class="guest-actions">

            <a href="/predrinks" class="guest-card">
                <div class="guest-icon">🍸</div>

                <h2>Pre-Drinks</h2>

                <p>
                    Request and vote for songs during pre-drinks.
                </p>
            </a>

            <a href="/reception" class="guest-card">
                <div class="guest-icon">🎶</div>

                <h2>Reception</h2>

                <p>
                    Send song requests directly to the DJ.
                </p>
            </a>

        </div>

        <div class="private-links">
            <a href="/couple-login">Couple Portal</a>
            <span>•</span>
            <a href="/admin-login">DJ/Admin Access</a>
        </div>

        <div class="footer-note">
            Music & Atmosphere by Norky
            <br>
            In collaboration with Deannie Landgoed
        </div>

    </section>

</main>

</body>
</html>
