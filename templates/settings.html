<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Settings</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<main class="page">

    <div class="container">

        <div class="glass-card">

            <div class="top-logos">
                <img src="/static/norky-logo.png" class="logo-norky">
                <div class="logo-line"></div>
                <img src="/static/deannie-logo.png" class="logo-deannie">
            </div>

            <h1>Wedding Settings</h1>

            <p class="subtitle">
                Configure the wedding branding and event details.
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="mode-note">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" class="form-box">

                <div>
                    <label>Couple Names</label>

                    <input
                        type="text"
                        name="couple_names"
                        value="{{ settings['couple_names'] }}"
                        required
                    >
                </div>

                <div>
                    <label>Wedding Date</label>

                    <input
                        type="text"
                        name="wedding_date"
                        value="{{ settings['wedding_date'] }}"
                    >
                </div>

                <div>
                    <label>Venue Name</label>

                    <input
                        type="text"
                        name="venue_name"
                        value="{{ settings['venue_name'] }}"
                    >
                </div>

                <div>
                    <label>Welcome Message</label>

                    <textarea
                        name="welcome_message"
                        rows="5"
                    >{{ settings['welcome_message'] }}</textarea>
                </div>

                <div>
                    <label>Facebook Link</label>

                    <input
                        type="text"
                        name="facebook_link"
                        value="{{ settings['facebook_link'] }}"
                    >
                </div>

                <div>
                    <label>Instagram Link</label>

                    <input
                        type="text"
                        name="instagram_link"
                        value="{{ settings['instagram_link'] }}"
                    >
                </div>

                <div>
                    <label>TikTok Link</label>

                    <input
                        type="text"
                        name="tiktok_link"
                        value="{{ settings['tiktok_link'] }}"
                    >
                </div>

                <button type="submit">
                    Save Wedding Settings
                </button>

            </form>

            <br>

            <a href="/qr" class="btn">
                Open QR Poster
            </a>

            <br><br>

            <a href="/" class="back-link">
                ← Back To Wedding Home
            </a>

        </div>

    </div>

</main>

</body>
</html>
